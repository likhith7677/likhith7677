<svg xmlns="http://www.w3.org/2000/svg" width="900" height="275" viewBox="0 0 900 275" role="img" aria-label="SignBridge AI reported test accuracy: ASL 96.48%, ISL 94.62%, everyday signs 90.79%">
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
<style>text{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#e6edf3}
.up{animation:up .9s ease-out both}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.6s ease-out both}@keyframes grow{from{transform:scaleX(0)}}
